server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only /<client>/recommendations.json is public; everything else is a 404.
    location ~ ^/[a-z0-9_-]+/recommendations\.json$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
