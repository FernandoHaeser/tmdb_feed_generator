services:
  # Named volumes start root-owned; hand /feed to the generator's unprivileged user (uid 10001).
  init:
    image: busybox:1.36
    command: ["chown", "10001", "/feed"]
    volumes:
      - feed:/feed
    restart: "no"

  generator:
    build: .
    env_file: .env
    environment:
      FEED_OUT: /feed
    volumes:
      - feed:/feed
      - ./clients:/app/clients:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${FEED_PORT:-8080}:80"
    volumes:
      - feed:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [generator]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  feed:
