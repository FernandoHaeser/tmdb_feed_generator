name: tests

on:
  workflow_dispatch:
  push:
    branches: [develop, release, master]
  pull_request:
    branches: [develop, release, master]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Generate the demo feed offline
        run: python -m tmdb_feed_generator generate --fixtures tests/fixtures --out dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t tmdb-feed-generator .
